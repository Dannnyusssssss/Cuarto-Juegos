# Despliegue a GitHub Pages: lint, tests y build antes de publicar.
# En CI (CI=true) el build falla si quedan [COMPLETAR] o el nombre provisional, así que no hay despliegue.
# Acciones oficiales fijadas por hash de commit; la versión va en el comentario.
name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos mínimos: solo lectura por defecto. La escritura en Pages y el token de despliegue
# los recibe únicamente el job que publica, no el que instala dependencias y compila.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Versión exacta, igual a la del entorno de desarrollo, para builds reproducibles.
          node-version: 24.21.0
          cache: npm

      - name: Instalar dependencias (lockfile)
        run: npm ci

      # Incluye las dependencias de desarrollo: son las que corren aquí al compilar.
      - name: Auditoría de dependencias (bloquea con avisos altos o críticos)
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test

      - name: Build (falla si quedan datos pendientes)
        run: npm run build

      - name: Buscar secretos (archivos versionados y dist/)
        run: npm run check:secrets

      - name: Subir el sitio
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configurar Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
